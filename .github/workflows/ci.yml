name: Validate and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appgrid-fit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: GNOME extension checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install GNOME packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes gnome-shell libglib2.0-bin unzip

      - name: Validate source and run tests
        run: npm run check

      - name: Validate schema reproducibility
        run: |
          set -euo pipefail
          glib-compile-schemas --strict --dry-run schemas
          schema_dir="$(mktemp -d)"
          glib-compile-schemas --strict --targetdir="$schema_dir" schemas
          cmp schemas/gschemas.compiled "$schema_dir/gschemas.compiled"

      - name: Build and inspect extension package
        id: package
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/package"
          mkdir -p "$package_dir"
          gnome-extensions pack --force \
            --extra-source=config.js \
            --extra-source=gridPages.js \
            --extra-source=LICENSE \
            . --out-dir="$package_dir"
          archive="$package_dir/appgrid-size@luyao.shell-extension.zip"
          unzip -t "$archive"
          npm run check:package -- "$archive"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"

      - name: Set up Python for Shexli
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run Shexli review checks
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/shexli-venv"
          "$RUNNER_TEMP/shexli-venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/shexli-venv/bin/pip" install \
            'shexli==0.2.1' 'tree-sitter==0.25.2'
          report="$RUNNER_TEMP/shexli-report.json"
          "$RUNNER_TEMP/shexli-venv/bin/shexli" \
            --format json "${{ steps.package.outputs.archive }}" > "$report"
          python - "$report" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as stream:
              report = json.load(stream)

          summary = report['summary']
          print(
              f"Shexli: {summary['status']} "
              f"({summary['finding_count']} findings)"
          )
          for finding in report['findings']:
              print(
                  f"{finding['severity'].upper()} {finding['rule_id']}: "
                  f"{finding['title']} — {finding['message']}"
              )
          if summary['finding_count']:
              raise SystemExit(1)
          PY

      - name: Upload validated extension
        uses: actions/upload-artifact@v7
        with:
          name: appgrid-fit-${{ github.sha }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 14
